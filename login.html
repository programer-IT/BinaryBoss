<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | BINARYBOSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <nav class="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="logo">⚡ <span>BINARYBOSS</span></a>
        <a href="register.html" class="btn btn-ghost">Register</a>
      </div>
    </nav>

    <main class="auth-wrap">
      <div class="glass auth-card">
        <h1>Welcome Back</h1>
        <p class="auth-sub">Login to continue your climb.</p>

        <div class="form-error" id="formError" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              autocomplete="username"
              maxlength="16"
              placeholder="Your username"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="Your password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Login</button>
        </form>

        <p class="auth-switch">
          New here? <a href="register.html">Create an account</a>
        </p>
      </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>

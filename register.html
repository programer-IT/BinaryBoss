<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | BINARYBOSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <nav class="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="logo">⚡ <span>BINARYBOSS</span></a>
        <a href="login.html" class="btn btn-ghost">Login</a>
      </div>
    </nav>

    <main class="auth-wrap">
      <div class="glass auth-card">
        <h1>Create Account</h1>
        <p class="auth-sub">Join the binary battle.</p>

        <div class="form-error" id="formError" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              autocomplete="username"
              maxlength="16"
              placeholder="e.g. BitMaster_01"
              required
            />
            <span class="hint"
              >3-16 characters: letters, numbers, underscore.</span
            >
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              placeholder="At least 6 characters"
              required
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              placeholder="Type it again"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-lg">
            Create Account
          </button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
